# Minimal Supabase CLI config for this project.
project_id = "faith-companion"

# Each function checks its caller itself (user access token, the dev tool's
# secret key, or the cron secret), so the gateway's JWT check is turned off.
[functions.chat]
verify_jwt = false

[functions.send-checkins]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# Store purchase events (not live until RevenueCat is set up). Checks its own shared secret.
[functions.revenuecat-webhook]
verify_jwt = false
